      if(n.nodeName==="STYLE"||n.nodeName==="LINK"){document.head.appendChild(document.importNode(n,true));return}
      document.body.appendChild(document.importNode(n,true))});
    scripts.forEach(function(t){var s=document.createElement("script");s.textContent=t;document.body.appendChild(s)});
  }catch(e){fail("La démonstration n'a pas pu s'ouvrir. Rechargez la page.")}
}
