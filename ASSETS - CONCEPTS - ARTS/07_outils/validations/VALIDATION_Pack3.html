<style>
:root{--bg:#17120d;--panel:#221a13;--card:#2c2219;--ink:#f1e4c8;--dim:#b9a888;--line:#3e3022;--amber:#ffc24a;--oui:#7fd68a;--non:#ff7a66;--tard:#8fb6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 120px}
h1{font:700 clamp(32px,7vw,52px)/1 "Grenze Gotisch",Georgia,serif;color:var(--amber);margin:0}
.sub{color:var(--dim);margin:.5em 0 0;max-width:62ch}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;margin-top:14px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px Figtree,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--amber);color:#2a1d08;border-color:var(--amber)}
.count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
.count b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card[data-d=oui]{border-color:var(--oui)}.card[data-d=non]{border-color:var(--non);opacity:.72}.card[data-d=tard]{border-color:var(--tard)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#1b1611;display:block;cursor:zoom-in}
.meta{padding:10px 12px 4px}.meta b{display:block;font-size:15px}.meta code{font:12px ui-monospace,monospace;color:var(--dim);overflow-wrap:anywhere}
.meta small{display:block;color:var(--dim);margin-top:3px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px 10px}
.btns button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 4px;font:700 13px Figtree,sans-serif;cursor:pointer}
.btns button.o.on{background:var(--oui);color:#10240f;border-color:var(--oui)}.btns button.n.on{background:var(--non);color:#2b0c07;border-color:var(--non)}.btns button.t.on{background:var(--tard);color:#0b1830;border-color:var(--tard)}
.note{margin:0 10px 10px;background:#1b1611;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 9px;font:13px Figtree,sans-serif;width:calc(100% - 20px)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.foot button{border:0;border-radius:10px;padding:11px 16px;font:700 14px Figtree,sans-serif;cursor:pointer;background:var(--amber);color:#2a1d08}
.foot button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:0;width:min(440px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.72)}
.one img{width:100%;aspect-ratio:1;object-fit:contain;background:#1b1611;display:block}
.one .meta{padding:12px 16px 0}.one .btns{padding:12px 16px}.one .btns button{padding:14px 4px;font-size:15px}
.one .nav{display:flex;justify-content:space-between;align-items:center;padding:0 16px 14px;color:var(--dim);font-size:13px}
.one .nav button{background:none;border:0;color:var(--dim);font:600 13px Figtree,sans-serif;cursor:pointer;padding:6px}
textarea{width:100%;height:230px;background:#1b1611;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px ui-monospace,monospace}
.pad{padding:16px}
</style></head><body><div class="wrap">

const KEY='tk-valid-'+LOT; let D={},N={}; try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');D=s.d||{};N=s.n||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({d:D,n:N}))}catch(e){}};
document.getElementById('lot').textContent=LOT;
let cat='tout',cur=0;const cats=['tout',...new Set(A.map(a=>a.cat)),'à décider'];
const vis=()=>A.filter(a=>cat==='tout'||(cat==='à décider'?!D[a.id]:a.cat===cat));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bar(){const b=document.getElementById('bar');const c={oui:0,non:0,tard:0};A.forEach(a=>{if(D[a.id])c[D[a.id]]++});
 b.innerHTML=cats.map(x=>`<button class="chip" aria-pressed="${x===cat}" data-c="${esc(x)}">${esc(x)}</button>`).join('')+`<span class="count"><b>${c.oui}</b> oui · <b>${c.non}</b> non · <b>${c.tard}</b> plus tard · <b>${A.length-c.oui-c.non-c.tard}</b> à décider</span>`;
 b.querySelectorAll('.chip').forEach(e=>e.onclick=()=>{cat=e.dataset.c;draw()});}
const btns=a=>`<div class="btns"><button class="o ${D[a.id]==='oui'?'on':''}" data-id="${a.id}" data-v="oui">Oui</button><button class="n ${D[a.id]==='non'?'on':''}" data-id="${a.id}" data-v="non">Non</button><button class="t ${D[a.id]==='tard'?'on':''}" data-id="${a.id}" data-v="tard">Plus tard</button></div>`;
const meta=a=>`<div class="meta"><b>${esc(a.nom)}</b><code>${esc(a.fichier)}</code><small>${esc(a.infos)}</small></div>`;
function draw(){bar();const g=document.getElementById('grid');g.innerHTML=vis().map(a=>`<div class="card" data-d="${D[a.id]||''}"><img src="${a.img}" alt="${esc(a.nom)}" data-open="${a.id}" loading="lazy">${meta(a)}${btns(a)}<input class="note" placeholder="Remarque (facultatif)" data-note="${a.id}" value="${esc(N[a.id]||'')}"></div>`).join('')||'<p class="sub">Rien à afficher ici.</p>';}
function set(id,v){D[id]=D[id]===v?undefined:v;if(!D[id])delete D[id];save();}
document.addEventListener('click',e=>{const t=e.target;if(t.dataset.v){set(t.dataset.id,t.dataset.v);if(dlg.open){if(D[t.dataset.id]&&cat!=='à décider')cur++;one()}draw()}else if(t.dataset.open){cur=vis().findIndex(a=>a.id===t.dataset.open);dlg.showModal();one()}});
document.addEventListener('input',e=>{if(e.target.dataset.note){N[e.target.dataset.note]=e.target.value;save()}});
const dlg=document.getElementById('dlg');
function one(){const v=vis();if(cur>=v.length||cur<0){dlg.close();return}const a=v[cur];document.getElementById('one').innerHTML=`<img src="${a.img}" alt="${esc(a.nom)}">${meta(a)}${btns(a)}<div class="nav"><button id="pv">← Précédent</button><span>${cur+1} / ${v.length}</span><button id="nx">Suivant →</button></div>`;
 document.getElementById('pv').onclick=()=>{cur=Math.max(0,cur-1);one()};document.getElementById('nx').onclick=()=>{cur++;one()};}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
document.addEventListener('keydown',e=>{if(!dlg.open)return;const a=vis()[cur];if(!a)return;const k={ArrowRight:'oui',ArrowLeft:'non',ArrowDown:'tard'}[e.key];if(k){e.preventDefault();D[a.id]=k;save();if(cat!=='à décider')cur++;one();draw()}});
document.getElementById('swipe').onclick=()=>{cat='à décider';draw();cur=0;if(vis().length){dlg.showModal();one()}};
document.getElementById('allyes').onclick=()=>{vis().forEach(a=>D[a.id]='oui');save();draw()};
function text(){const L=v=>A.filter(a=>D[a.id]===v).map(a=>a.id+(N[a.id]?' ('+N[a.id]+')':''));const rest=A.filter(a=>!D[a.id]).map(a=>a.id);
 return `VALIDATION TinKnight · ${LOT}\nOUI (${L('oui').length}) : ${L('oui').join(', ')||'aucun'}\nNON (${L('non').length}) : ${L('non').join(', ')||'aucun'}\nPLUS TARD (${L('tard').length}) : ${L('tard').join(', ')||'aucun'}\nSANS AVIS (${rest.length}) : ${rest.join(', ')||'aucun'}`;}
const exp=document.getElementById('exp');
document.getElementById('export').onclick=()=>{document.getElementById('txt').value=text();document.getElementById('expmsg').textContent='Colle ce texte dans la conversation.';exp.showModal()};
document.getElementById('copy').onclick=async()=>{const t=document.getElementById('txt');try{await navigator.clipboard.writeText(t.value);document.getElementById('expmsg').textContent='Copié.'}catch(e){t.select();document.getElementById('expmsg').textContent='Sélectionné : copie avec Ctrl+C.'}};
document.getElementById('closeexp').onclick=()=>exp.close();
draw();
</script></body></html>
