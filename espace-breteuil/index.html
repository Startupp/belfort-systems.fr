<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace Breteuil</title>
<meta name="description" content="Le planning du Château de Breteuil et les raccourcis de chacun, en un seul endroit.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6B1524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Breteuil">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/icon-180.png">
<link rel="preload" href="/assets/fonts/archivo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script>
  /* Réglages d'affichage appliqués avant le premier rendu (pas de clignotement). */
  (function () {
    try {
      var r = JSON.parse(localStorage.getItem("eb:reglages") || "{}");
      if (r.theme === "clair" || r.theme === "sombre") document.documentElement.setAttribute("data-theme", r.theme);
      if (r.texte === "grand" || r.texte === "tres-grand") document.documentElement.setAttribute("data-texte", r.texte);
    } catch (e) {}
  })();
</script>
</head>
<body>
<main id="app" class="page" aria-live="polite">
  <p class="chargement">Chargement de l'Espace Breteuil…</p>
</main>
<noscript><p class="page">L'Espace Breteuil a besoin de JavaScript. Ouvrez-le dans Safari, Chrome ou Edge.</p></noscript>

<dialog class="detail" id="detail" aria-labelledby="detail-titre"></dialog>

<script src="/assets/config.js"></script>
<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
