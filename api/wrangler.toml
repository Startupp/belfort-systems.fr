# Configuration du Worker « belfort-admin » : service du site belfort-systems.fr
# (tableau de bord /admin/, disponibilités, demandes, factures).
# Distinct de « belfort-api », qui sert l'Espace Breteuil et n'est pas géré par ce dossier.
# Aucun secret ici : ADMIN_PASSWORD (et SESSION_SALT, facultatif) sont des secrets
# Worker, posés par le workflow .github/workflows/deploy-admin-worker.yml depuis les
# secrets du dépôt GitHub, ou par `npx wrangler secret put ADMIN_PASSWORD`.
# Les identifiants D1 et KV ci-dessous sont vérifiés et remplacés au déploiement.

name = "belfort-admin"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Base D1 : clients, projets, demandes, factures, journal…
[[d1_databases]]
binding = "DB"
database_name = "belfort-systems"
database_id = "66de32b0-01d9-4f8e-a909-05598f941e41"

# KV : sessions admin, limitation de débit, cache du catalogue.
[[kv_namespaces]]
binding = "KV"
id = "24f34957a1644d729c773708e6e05088"

# Variables publiques (non secrètes).
[vars]
# Origines autorisées pour CORS, séparées par des virgules. http://localhost:* est
# toujours accepté en plus (développement).
# - espace-breteuil.pages.dev : appli Espace Breteuil (Cloudflare Pages, branche main) ;
# - breteuil.belfort-systems.fr : futur sous-domaine de la même appli (prévu à l'avance,
#   sans effet tant que le domaine n'est pas branché).
ORIGINES = "https://belfort-systems.fr,https://espace-breteuil.pages.dev,https://breteuil.belfort-systems.fr"
