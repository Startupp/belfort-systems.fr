name: Assets TinKnight
on:
  push:
    paths: ['.github/reorg/**', '.github/workflows/assets-tinknight.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ranger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/reorg/importer_lots.sh
          bash .github/reorg/reorganiser.sh
          git add -A "ASSETS - CONCEPTS - ARTS" .github/reorg
          git diff --cached --quiet || git commit -m "Assets TinKnight : rangement et nouveaux lots"
          git push
