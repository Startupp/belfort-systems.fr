name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Liste d'AUTORISATION : seul ce qui est copié ici est publié sur belfort-systems.fr.
      # Tout le reste du dépôt (api/, docs/, admin/apercu/, *.md, .github/, tests, scripts,
      # « ASSETS - CONCEPTS - ARTS »…) n'est jamais mis en ligne.
      # Ajouter une page publique = l'ajouter à PUBLIC ci-dessous.
      - name: Construire _site/ (liste d'autorisation)
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          # Fichiers racine
          for f in index.html 404.html CNAME .nojekyll favicon.svg robots.txt sitemap.xml; do
            [ -e "$f" ] && cp "$f" _site/
          done
          # Dossiers publics (copiés sans les fichiers de développement)
          PUBLIC="assets qui-suis-je portail clients factures haccp ecorce espace-breteuil"
          for d in $PUBLIC; do
            [ -d "$d" ] || continue
            rsync -a \
              --exclude='*.md' --exclude='tests/' --exclude='test/' --exclude='*.test.mjs' --exclude='*.test.js' \
              --exclude='*.sh' --exclude='*.py' --exclude='node_modules/' --exclude='.DS_Store' \
              --exclude='package.json' --exclude='package-lock.json' \
              "$d/" "_site/$d/"
          done
          # Panneau admin : le code seulement (pas admin/apercu/, pas les notes)
          mkdir -p _site/admin
          cp admin/index.html admin/admin.css admin/admin.js _site/admin/
          # Garde-fou : échoue si un chemin interdit s'est glissé dans l'artefact
          interdit=$(cd _site && find . \( -path './api*' -o -path './docs*' -o -path './admin/apercu*' -o -path './.github*' \
            -o -path './ASSETS*' -o -name '*.md' -o -name '*.sql' -o -path '*/tests/*' \) -print | head -20)
          if [ -n "$interdit" ]; then echo "::error::Fichiers interdits dans _site/ :"; echo "$interdit"; exit 1; fi
          if grep -rIl --include='*.json' --include='*.html' --include='*.js' '@breteuil\.fr' _site/ | grep -v '^_site/espace-breteuil/' ; then
            echo "::warning::Adresse @breteuil.fr trouvée dans un fichier publié (hors espace-breteuil) : vérifier."
          fi
          du -sh _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
