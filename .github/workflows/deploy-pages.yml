name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Construction de _site/ (liste d'autorisation + garde-fou) : même script que Cloudflare Pages.
      # Ce workflow reste actif jusqu'à la bascule vers Cloudflare Pages ; pour le désactiver ensuite,
      # voir docs/MIGRATION-CLOUDFLARE-PAGES.md, étape E.
      - name: Construire _site/ (liste d'autorisation)
        run: bash scripts/build-site.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
